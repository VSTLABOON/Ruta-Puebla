<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="60%" stop-color="#B84A2C"/>
      <stop offset="100%" stop-color="#091536"/>
    </linearGradient>
    <pattern id="talaveraGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#FAF6EE" stroke-width="0.6" stroke-opacity="0.12"/>
      <polygon points="20,6 26,20 20,34 14,20" fill="#FAF6EE" fill-opacity="0.07"/>
      <circle cx="20" cy="20" r="2.5" fill="#F0B43A" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Fondo Cerámico Talavera -->
  <rect width="800" height="320" fill="url(#bgGrad)"/>
  <rect width="800" height="320" fill="url(#talaveraGrid)"/>

  <!-- Marco Doble Filete Majólica -->
  <rect x="12" y="12" width="776" height="296" rx="18" fill="none" stroke="#FAF6EE" stroke-width="2" stroke-opacity="0.45"/>
  <rect x="18" y="18" width="764" height="284" rx="14" fill="none" stroke="#F0B43A" stroke-width="1.5" stroke-dasharray="8,5" stroke-opacity="0.7"/>

  <!-- Rosetones Esquinas -->
  <circle cx="34" cy="34" r="7" fill="#F0B43A" opacity="0.85"/>
  <circle cx="766" cy="34" r="7" fill="#F0B43A" opacity="0.85"/>
  <circle cx="34" cy="286" r="7" fill="#F0B43A" opacity="0.85"/>
  <circle cx="766" cy="286" r="7" fill="#F0B43A" opacity="0.85"/>

  
      <!-- Tibor de Talavera Poblana y Horno Tradicional -->
      <g transform="translate(220, 22)">
        <circle cx="180" cy="90" r="68" fill="#F0B43A" opacity="0.22"/>
        <!-- Arco de Horno de Barro -->
        <path d="M60,165 L60,90 A52,52 0 0,1 164,90 L164,165 Z" fill="#FAF6EE" opacity="0.22"/>
        <path d="M82,165 L82,108 A30,30 0 0,1 142,108 L142,165 Z" fill="#F0B43A" opacity="0.45"/>
        <!-- Tibor / Ánfora de Talavera Majólica -->
        <path d="M215,40 L255,40 L248,58 C278,72 282,125 258,155 L212,155 C188,125 192,72 222,58 Z" fill="#FAF6EE"/>
        <path d="M210,40 L260,40 L256,30 L214,30 Z" fill="#F0B43A"/>
        <!-- Decoración Azul Cobalto con Pluma -->
        <circle cx="235" cy="98" r="22" fill="none" stroke="#0F3078" stroke-width="4" stroke-dasharray="6,4"/>
        <circle cx="235" cy="98" r="10" fill="#0F3078"/>
        <path d="M206,75 Q235,65 264,75" fill="none" stroke="#0F3078" stroke-width="3"/>
        <path d="M206,125 Q235,135 264,125" fill="none" stroke="#0F3078" stroke-width="3"/>
      </g>
    

  <!-- Cartela Inferior de Códice Virreinal -->
  <rect x="36" y="205" width="728" height="82" rx="14" fill="#071330" fill-opacity="0.82" stroke="#F0B43A" stroke-width="1.5"/>
  <text x="58" y="232" fill="#F0B43A" font-family="Georgia, serif" font-size="13" font-weight="bold" letter-spacing="2">
    BARRIO LA LUZ • SIGLO XVIII–XIX
  </text>
  <text x="58" y="260" fill="#FAF6EE" font-family="Georgia, serif" font-size="21" font-weight="bold">
    Alfareria Tradicional del Barrio de La Luz
  </text>
  <text x="58" y="278" fill="#FAF6EE" fill-opacity="0.8" font-family="sans-serif" font-size="12">
    Arquitectura vernácula industrial de hornos abovedados de adobe y ladrillo cocido
  </text>
</svg>