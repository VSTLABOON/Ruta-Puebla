<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3078"/>
      <stop offset="60%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#091536"/>
    </linearGradient>
    <pattern id="talaveraGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#FAF6EE" stroke-width="0.6" stroke-opacity="0.12"/>
      <polygon points="20,6 26,20 20,34 14,20" fill="#FAF6EE" fill-opacity="0.07"/>
      <circle cx="20" cy="20" r="2.5" fill="#EDE28E" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Fondo Cerámico Talavera -->
  <rect width="800" height="320" fill="url(#bgGrad)"/>
  <rect width="800" height="320" fill="url(#talaveraGrid)"/>

  <!-- Marco Doble Filete Majólica -->
  <rect x="12" y="12" width="776" height="296" rx="18" fill="none" stroke="#FAF6EE" stroke-width="2" stroke-opacity="0.45"/>
  <rect x="18" y="18" width="764" height="284" rx="14" fill="none" stroke="#EDE28E" stroke-width="1.5" stroke-dasharray="8,5" stroke-opacity="0.7"/>

  <!-- Rosetones Esquinas -->
  <circle cx="34" cy="34" r="7" fill="#EDE28E" opacity="0.85"/>
  <circle cx="766" cy="34" r="7" fill="#EDE28E" opacity="0.85"/>
  <circle cx="34" cy="286" r="7" fill="#EDE28E" opacity="0.85"/>
  <circle cx="766" cy="286" r="7" fill="#EDE28E" opacity="0.85"/>

  
      <!-- Arquería Virreinal, Fuentes y Murales de Puebla -->
      <g transform="translate(185, 30)">
        <circle cx="215" cy="82" r="65" fill="#EDE28E" opacity="0.22"/>
        <!-- Triple Arquería de Cantera -->
        <rect x="75" y="52" width="280" height="106" rx="4" fill="#FAF6EE" opacity="0.95"/>
        <rect x="70" y="42" width="290" height="12" rx="3" fill="#EDE28E"/>
        <path d="M98,158 L98,100 A28,28 0 0,1 154,100 L154,158 Z" fill="#0F3078"/>
        <path d="M187,158 L187,94 A30,30 0 0,1 247,94 L247,158 Z" fill="#0F3078"/>
        <path d="M276,158 L276,100 A28,28 0 0,1 332,100 L332,158 Z" fill="#0F3078"/>
        <!-- Azulejos en enjutas -->
        <polygon points="170,68 178,60 186,68 178,76" fill="#B84A2C"/>
        <polygon points="248,68 256,60 264,68 256,76" fill="#B84A2C"/>
        <!-- Fuente Colonial Central -->
        <path d="M192,135 L242,135 L234,152 L200,152 Z" fill="#EDE28E"/>
        <rect x="213" y="114" width="8" height="22" fill="#FAF6EE"/>
      </g>
    

  <!-- Cartela Inferior de Códice Virreinal -->
  <rect x="36" y="205" width="728" height="82" rx="14" fill="#071330" fill-opacity="0.82" stroke="#EDE28E" stroke-width="1.5"/>
  <text x="58" y="232" fill="#EDE28E" font-family="Georgia, serif" font-size="13" font-weight="bold" letter-spacing="2">
    ZOCALO CENTRO NUCLEO • SIGLO XVIII (1790) / PRIMER MUSEO REGIONAL (1926)
  </text>
  <text x="58" y="260" fill="#FAF6EE" font-family="Georgia, serif" font-size="21" font-weight="bold">
