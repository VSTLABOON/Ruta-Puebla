<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1738B5"/>
      <stop offset="60%" stop-color="#0E2C9C"/>
      <stop offset="100%" stop-color="#07154E"/>
    </radialGradient>
  </defs>
  <!-- Base circular Talavera plate -->
  <rect width="192" height="192" rx="48" fill="url(#bg)"/>
  <circle cx="96" cy="96" r="82" fill="#EFF1F8" stroke="#EDE28E" stroke-width="4"/>
  <circle cx="96" cy="96" r="76" fill="#EFF1F8" stroke="#0E2C9C" stroke-width="3"/>
  <circle cx="96" cy="96" r="72" fill="none" stroke="#9597C1" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <!-- Popocatépetl Volcano & Church towers representation -->
  <path d="M96 52 L148 116 L44 116 Z" fill="#9597C1" opacity="0.35"/>
  <path d="M96 52 L140 114 L52 114 Z" fill="none" stroke="#0E2C9C" stroke-width="3" stroke-linejoin="round"/>
  <!-- Smoke puffs -->
  <path d="M100 48 Q106 42 114 44 Q122 46 120 38" fill="none" stroke="#7B5E86" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Horizontal divider line -->
  <line x1="32" y1="116" x2="160" y2="116" stroke="#0E2C9C" stroke-width="2.5"/>
  
  <!-- PoPoGo Text in Talavera Cobalt -->
  <text x="96" y="148" font-family="serif" font-weight="900" font-size="28" fill="#0E2C9C" text-anchor="middle" letter-spacing="1">PoPoGo</text>
  
  <!-- Floral accents -->
  <circle cx="96" cy="164" r="3.5" fill="#EDE28E" stroke="#0E2C9C" stroke-width="1.2"/>
  <circle cx="82" cy="165" r="2.5" fill="#7B5E86"/>
  <circle cx="110" cy="165" r="2.5" fill="#7B5E86"/>
</svg>
