<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Papel talavera: claro / oscuro (misma clave que usa la app)
      (function () {
        var s = localStorage.getItem('popogo_paper');
        var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>PopoGo - Exploración Peatonal y Rutas Culturales en Puebla</title>
    <meta name="description" content="PopoGo: mapa interactivo de rutas peatonales accesibles, talleres artesanales y patrimonio vivo en Puebla" />
    <meta name="theme-color" content="#0F3078" />
    <link rel="icon" type="image/png" href="/popogo-logo.png" />
    <link rel="apple-touch-icon" href="/popogo-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="bg-[#F2EBDC] text-[#162035] antialiased font-sans overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
